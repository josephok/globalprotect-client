name: Packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  deb:
    name: deb (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc meson ninja-build pkg-config dpkg-dev fakeroot \
            libgnutls28-dev libxml2-dev libp11-kit-dev zlib1g-dev
      - name: Build deb
        run: ./packaging/build-deb.sh
      - name: Get package file name
        id: pkg
        run: echo "name=$(basename dist/deb/*.deb)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: dist/deb/*.deb

  rpm:
    name: rpm (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: fedora:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          dnf install -y rpm-build redhat-rpm-config gcc meson tar gzip findutils \
            gnutls-devel libxml2-devel p11-kit-devel zlib-devel
      - name: Build rpm
        run: ./packaging/build-rpm.sh
      - name: Get package file name
        id: pkg
        run: |
          rm -f dist/rpm/RPMS/*/*-debuginfo-*.rpm dist/rpm/RPMS/*/*-debugsource-*.rpm
          echo "name=$(basename dist/rpm/RPMS/*/*.rpm)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: dist/rpm/RPMS/*/*.rpm

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb, rpm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches meson.build version
        run: |
          version=$(sed -n "s/^[[:space:]]*version *: *'\([^']*\)'.*/\1/p" meson.build | head -n1)
          [ "${GITHUB_REF_NAME}" = "v${version}" ] || {
            echo "tag ${GITHUB_REF_NAME} does not match meson.build version ${version}" >&2
            exit 1
          }
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/*.deb artifacts/*.rpm --generate-notes --title "${GITHUB_REF_NAME}"
